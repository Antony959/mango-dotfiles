#Key Bindings

#apps
bind=SUPER,D,spawn,fuzzel
bind=SUPER,Z,spawn,foot
bind=SUPER,E,spawn,dolphin
bind=SUPER,B,spawn,brave-origin --password-store=basic
bind=SUPER,W,spawn,waypaper
bind=SUPER,X,spawn,vesktop
bind=SUPER+SHIFT,r,reload_config
bind=SUPER,K,spawn,wlogout
bind=SUPER,L,spawn,hyprlock

#scripts
bind=SUPER,V,spawn,sh -c "cliphist list | fuzzel --dmenu -w 50 --lines 15 -p 'Área de Transferência: ' | cliphist decode | wl-copy"
bind=NONE,Print,spawn,sh -c 'f="$HOME/Imagens/Capturas de tela/Screenshot_$(date +%Y-%m-%d_%H-%M-%S).png"; grim -g "$(slurp)" "$f" && wl-copy < "$f"'
bind=SUPER,R,spawn,~/.config/mango/scripts/reload_waybar

#window
bind=SUPER,m,quit
bind=SUPER,q,killclient,
bind=SUPER+SHIFT,Q,killclient,force
bind=ALT,F,togglemaximizescreen
bind=ALT+SHIFT,F,togglefullscreen
bind=SUPER,space,togglefloating,
bind=ALT,Tab,focusstack,next
bind=SUPER,g,toggleglobal
bind=SUPER,Tab,togglejump,
bind=SUPER,n,switch_layout

#mousebinds
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_middle,togglemaximizescreen,0
mousebind=SUPER,btn_right,moveresize,curresize

# switch window focus
bind=ALT,Left,focusdir,left
bind=ALT,Right,focusdir,right
bind=ALT,Up,focusdir,up
bind=ALT,Down,focusdir,down

# swap window
bind=SUPER+Alt,Up,exchange_client,up
bind=SUPER+Alt,Down,exchange_client,down
bind=SUPER+Alt,Left,exchange_client,left
bind=SUPER+Alt,Right,exchange_client,right

# switch layout
bind=SUPER,n,switch_layout

# tag switch
bind=SUPER,Left,viewtoleft,0
bind=SUPER,Right,viewtoright,0
bind=CTRL+SUPER,Left,tagtoleft,0
bind=CTRL+SUPER,Right,tagtoright,0

bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

bind=Alt,1,tag,1,0
bind=Alt,2,tag,2,0
bind=Alt,3,tag,3,0
bind=Alt,4,tag,4,0
bind=Alt,5,tag,5,0
bind=Alt,6,tag,6,0
bind=Alt,7,tag,7,0
bind=Alt,8,tag,8,0
bind=Alt,9,tag,9,0

#Autostart
exec-once=waybar
exec-once=mako
exec-once=awww-daemon
exec-once=amixer -c FuxiH3 set PCM 100% unmute
exec-once=wl-paste --type text --watch cliphist store &
exec-once=wl-paste --type image --watch cliphist store &
exec-once=/usr/libexec/xdg-desktop-portal-wlr
exec-once=/usr/libexec/xdg-desktop-portal-gtk
exec-once=/usr/libexec/xdg-desktop-portal
exec-once=/usr/libexec/polkit-gnome-authentication-agent-1

#Window Rules
windowrule=isfloating:1,isglobal:1,isoverlay:1,isnoborder:1,nofocus:1,focused_opacity:1.0,unfocused_opacity:1.0,noblur:1,width:517,height:293,offsetx:100,offsety:100,,title:Picture-in-picture
windowrule=focused_opacity:1.0,unfocused_opacity:1.0,noblur:1,appid:brave-origin
windowrule=focused_opacity:1.0,unfocused_opacity:1.0,noblur:1,appid:steam
windowrule=focused_opacity:1.0,unfocused_opacity:1.0,noblur:1,title:Vesktop
windowrule=title:"Transmissão de reggael0l",isglobal:1,isoverlay:1,isfloating:1
windowrule=isfloating:1,focused_opacity:1.0,unfocused_opacity:1.0,noblur:1,appid:com.interversehq.qView
windowrule=isfloating:1,focused_opacity:1.0,unfocused_opacity:1.0,noblur:1,appid:waypaper
windowrule=focused_opacity:1.0,unfocused_opacity:1.0,noblur:1,appid:broke

# Enviroment Variables
env=QT_IM_MODULES,wayland;fcitx
env=XMODIFIERS,@im=fcit
env=QT_QPA_PLATFORMTHEME,qt6ct

# Window effect
blur=0
blur_layer=0
blur_optimized=1
blur_params_num_passes = 2
blur_params_radius = 5
blur_params_noise = 0.02
blur_params_brightness = 0.9
blur_params_contrast = 0.9
blur_params_saturation = 1.2

border_radius=3
no_radius_when_single=0
focused_opacity=0.95
unfocused_opacity=0.80

shadows = 0
layer_shadows = 0
shadow_only_floating = 1
shadows_size = 10
shadows_blur = 15
shadows_position_x = 0
shadows_position_y = 0
shadowscolor= 0x000000ff

# Animation Configuration(support type:zoom,slide)
# tag_animation_direction: 1-horizontal,0-vertical
animations=1
layer_animations=1
animation_type_open=slide
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.4
zoom_end_ratio=0.8
fadein_begin_opacity=0.5
fadeout_begin_opacity=0.8
animation_duration_move=500
animation_duration_open=400
animation_duration_tag=350
animation_duration_close=800
animation_duration_focus=0
animation_curve_open=0.46,1.0,0.29,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opafadeout=0.5,0.5,0.5,0.5
animation_curve_opafadein=0.46,1.0,0.29,1

# Scroller Layout Setting
scroller_structs=20
scroller_default_proportion=0.8
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=1
edge_scroller_focus_allow_speed=0.0
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0

# Master-Stack Layout Setting
new_is_master=1
default_mfact=0.55
default_nmaster=1
smartgaps=0

# Dwindle Layout Setting
dwindle_smart_split=0
dwindle_drop_simple_split=1
dwindle_manual_split=0
dwindle_hsplit=1
dwindle_vsplit=1
dwindle_preserve_split=0

# Overview Setting
hotarea_size=10
enable_hotarea=0
ov_tab_mode=0
ov_no_resize=1
overviewgappi=5
overviewgappo=30

# Misc
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
idleinhibit_ignore_visible=0
sloppyfocus=1
warpcursor=1
focus_cross_monitor=0
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
cursor_size=24
drag_tile_to_tile=1
drag_tile_small=1

# keyboard
repeat_rate=25
repeat_delay=600
numlockon=0
xkb_rules_layout=br

# mouse
# need relogin to make it apply
mouse_natural_scrolling=0

# Appearance
gappih=5
gappiv=5
gappoh=7
gappov=2
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
borderpx=4
focuscolor=83C092FF
bordercolor=3A515DFF
maximizescreencolor=425047FF
globalcolor=D699B6FF
dropcolor=DBBC7FFF
rootcolor=0x201b14ff
urgentcolor=E67E80FF
splitcolor=0xEB441EFF
focuscolor=83C092FF
urgentcolor=E67E80FF
scratchpadcolor=0x516c93ff
overlaycolor=0x14a57cff

cursor_size=30
cursor_theme=everforest-cursors

# layout support:
# tile,scroller,grid,deck,monocle,center_tile,vertical_tile,vertical_scroller
tagrule=id:1,layout_name:tile
tagrule=id:2,layout_name:tile
tagrule=id:3,layout_name:tile
tagrule=id:4,layout_name:tile
tagrule=id:5,layout_name:tile
tagrule=id:6,layout_name:tile
tagrule=id:7,layout_name:tile
tagrule=id:8,layout_name:tile
tagrule=id:9,layout_name:tile

# monitor 

monitorrule=name:^HDMI-A-1$,width:1920,height:1080,refresh:180,x:0,y:0,scale:1,rr:0,vrr:1
allow_tearing=2

# Axis Bindings
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client

# Controle de Volume (via wpctl)
bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_SINK@ 5%+
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_SINK@ 5%-
bind=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_SINK@ toggle
bind=SHIFT,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_SOURCE@ toggle # Muta o microfone

# Controle de Mídia (via playerctl)
bind=NONE,XF86AudioPlay,spawn,playerctl play-pause
bind=NONE,XF86AudioNext,spawn,playerctl next
bind=NONE,XF86AudioPrev,spawn,playerctl previous
